:23 Мотивы и конкретизация выгод Часть 1, 00:54:19–01:03:03; фото 1863_949 Пример рекламного заголовка Часть 1, 01:03:03–01:05:18 Роли покупателей Часть 2, 00:00:00–00:05:26 Лестница и работа с разными уровнями Часть 2, 00:05:30–00:08:20; 00:17:23–00:19:41; фото 1685_989 Доверие, газеты и склад двигателей Часть 2, 00:07:52–00:15:49 Каналы, маркировка и GEO Часть 2, 00:21:16–00:31:48 Выбор критериев и B2B потребность Часть 2, 00:31:51–00:36:31; 00:40:57–00:44:24 Планирование и контроль Часть 2, 00:36:39–00:40:49 Основатель и бренд компании Часть 2, 00:44:26–00:46:06", "role": "theory"}, {"type": "h", "text": "Что не удалось подтвердить по полученным материалам", "role": "theory"}, {"type": "p", "text": "Полный список пятидесяти мотивов: на фотографии видны шестнадцать, часть дополнительных мотивов звучит в речи. Остальные не сочинены.", "role": "theory"}, {"type": "p", "text": "Цифры о поведении поколений, доле нейроответов, эффективности отдельных платформ и размере семейных сегментов: источников исследования в записи нет, некоторые числа противоречивы. Их нельзя переносить в бизнес-план как проверенные данные.", "role": "theory"}, {"type": "p", "text": "Полное содержание модели, распознанной как Space, около 00:28:45 первой части: сохранён понятный смысл примеров о сложности покупки, участниках и времени решения. Точное название и авторство не установлены.", "role": "theory"}, {"type": "p", "text": "Названия книги и автора о коммерческом предложении, некоторых рекламных технологий, предприятий и моделей оборудования: повреждённые имена не восстановлены по внешним догадкам. Точная формулировка определения маркетинга со слайда также отсутствует: не придумана как цитата.", "role": "theory"}, {"type": "p", "text": "Вторая часть около 00:10:00 упоминает iPad и прежние планшеты, но существенная часть объяснения повреждена. Надёжный вывод о конкретной истории компании не сделан.", "role": "theory"}, {"type": "p", "text": "Речь с 01:07 первой части преимущественно относится к работе в аудитории и обмену фотографиями. Содержательных условий продуктов и результатов этого упражнения из неё уверенно извлечь нельзя. Полноценная презентация и ссылки из QR-кодов не предоставлены; их содержание не считается прочитанным.", "role": "theory"}, {"type": "p", "text": "Методичка передаёт доступную логику лекции и её примеры. Рабочие формы и применение к JKids помогают действовать, но остаются предложениями до решения Сергея. Новые результаты интервью и тестов фиксируются в действующем основном документе, а затем используются для корректировки материалов команды.", "role": "theory"}], "short": "Источники и ограничения", "desc": "Вернуться к записи и проверить утверждение"}]</script>
<script>
'use strict';
const lessons=JSON.parse(document.getElementById('content-data').textContent);
const groups=[{name:'Основы',ids:[1,2,3]},{name:'Понять покупателя',ids:[4,5,6,7,8]},{name:'Собрать предложение',ids:[9,10]},{name:'Помочь выбрать',ids:[11,12]},{name:'Продвижение и контроль',ids:[13,14,15,16]},{name:'Применить на практике',ids:[17,18]}];
const names={theory:'Разбор',example:'Пример из лекции',jkids:'Применение к JKids',practice:'Практика',source:'Источник'};
const content=document.getElementById('content'),sidebar=document.getElementById('sidebar'),search=document.getElementById('search');
let selected=null,filter='all';
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function textHTML(s){return escape(s).replace(/https?:\/\/[^\s;]+/g,u=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);}
function compact(s){let t=s.replace(/^(Из лекции(?: и фотографии)?\.|Пример лектора\.|Применение к JKids\.|Рабочее задание\.|Редакторское пояснение\.|Случай из записи\.|Гипотеза для JKids\.|Источник:|Источники:|Источники лекции:|Источники проверки:)\s*/, '');let first=t.match(/^(.{20,180}?[.!?])(?:\s|$)/);return first?first[1]:t.length>125?t.slice(0,122)+'…':t;}
function setNav(){sidebar.innerHTML=`<button class="navbutton ${selected===null?'active':''}" data-home>Все темы</button>`+groups.map(g=>`<div class="navlabel">${g.name}</div>`+g.ids.map(id=>`<button class="navbutton ${id===selected?'active':''}" data-lesson="${id}" ${id===selected?'aria-current="page"':''}><span class="navnum">${String(id).padStart(2,'0')}</span>${escape(lessons[id].short)}</button>`).join('')).join('')+`<div class="navlabel">О материале</div>`+[0,19].map(id=>`<button class="navbutton ${id===selected?'active':''}" data-lesson="${id}">${escape(lessons[id].short)}</button>`).join('');}
function closeNav(){sidebar.classList.remove('show');document.getElementById('cover').classList.remove('show');document.getElementById('menu').setAttribute('aria-expanded','false');}
function go(id,block){search.value='';filter='all';location.hash=id===null?'home':`lesson-${id}${Number.isInteger(block)?'-block-'+block:''}`;if(location.hash===(id===null?'#home':`#lesson-${id}${Number.isInteger(block)?'-block-'+block:''}`))route();closeNav();}
function home(){selected=null;setNav();content.innerHTML=`<div class="home-top"><div><p class="eyebrow">Рабочий учебник</p><h1>От понимания клиента<br>к понятному действию</h1><p class="lead">Выбирай нужную тему или проходи по порядку. В каждом уроке — объяснения, реальные примеры из лекции и применение к JKids.</p></div><button class="primary" data-lesson="1">Начать с основ</button></div><div class="quick"><button data-lesson="11"><span>Перед публикацией</span><b>Что сейчас нужно покупателю?</b><small>Лестница готовности и задача сообщения</small></button><button data-lesson="17"><span>Когда пора делать</span><b>Открыть рабочие формы</b><small>Клиент · выгода · контент · небольшой тест</small></button></div><div class="module-grid">${groups.map((g,i)=>`<section class="module"><div class="module-top"><span class="module-index">${String(i+1).padStart(2,'0')}</span><h2>${g.name}</h2></div>${g.ids.map(id=>`<button class="topic" data-lesson="${id}"><span><b>${escape(lessons[id].short)}</b><small>${escape(lessons[id].desc)}</small></span><em>${String(id).padStart(2,'0')}</em></button>`).join('')}</section>`).join('')}</div><div class="homebottom"><button class="textbtn" data-lesson="0">Как читать и что считать источником</button><button class="textbtn" data-lesson="19">Карта таймкодов и ограничения</button></div><div class="footer">Полный материал двух расшифровок и трёх слайдов. Слова лектора, примеры и предложения для JKids обозначены отдельно.</div>`;window.scrollTo(0,0);}
function renderTable(rows){return `<div class="tablewrap"><table><thead><tr>${rows[0].map(x=>`<th scope="col">${escape(x)}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(row=>`<tr>${row.map((x,j)=>`<td data-label="${escape(rows[0][j])}">${textHTML(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function lesson(id,target){selected=id;setNav();const l=lessons[id];const roles=[...new Set(l.blocks.filter(b=>b.type!=='h').map(b=>b.role))];const headings=l.blocks.map((b,i)=>({b,i})).filter(x=>x.b.type==='h');
content.innerHTML=`<div class="crumb"><button class="textbtn" data-home>Все темы</button><span>/</span><span>${id?`Тема ${String(id).padStart(2,'0')}`:'О методичке'}</span></div><header class="lesson-header"><span class="lesson-tag">${escape(groups.find(g=>g.ids.includes(id))?.name||'Источники и правила чтения')}</span><h1>${escape(l.title)}</h1><p class="lead">${escape(l.desc)}</p></header><div class="lesson-layout"><div class="reading"><div class="tools" aria-label="Какие блоки показывать"><button class="chip ${filter==='all'?'active':''}" data-filter="all" aria-pressed="${filter==='all'}">Всё</button>${roles.filter(r=>r!=='source').map(r=>`<button class="chip ${filter===r?'active':''}" data-filter="${r}" aria-pressed="${filter===r}">${escape(r==='example'?'Примеры':r==='jkids'?'JKids':names[r])}</button>`).join('')}<button class="expand" id="expand">Раскрыть все блоки</button></div><div id="blocks">${l.blocks.map((b,i)=>blockHTML(b,i,target)).join('')}</div><div class="lesson-bottom"><button class="secondary" ${id===0?'data-home':`data-lesson="${id-1}"`}>${id===0?'Все темы':'Предыдущая тема'}</button>${id<19?`<button class="primary" data-lesson="${id+1}">Следующая тема</button>`:`<button class="primary" data-home>К списку тем</button>`}</div><div class="footer">«Применение к JKids» и рабочие задания — адаптация, а не подтверждённые решения школы. Таймкоды сохранены в блоках «Источник».</div></div><aside class="lesson-aside"><b>В этой теме</b>${headings.length?headings.map(x=>`<button data-jump="${x.i}">${escape(x.b.text)}</button>`).join(''):`<p>Открывай блоки по одному или раскрой весь урок.</p>`}<button data-sources>Показать источники</button></aside></div>`;
if(Number.isInteger(target)){requestAnimationFrame(()=>{const el=document.getElementById('block-'+target);if(el){if(el.tagName==='DETAILS')el.open=true;el.scrollIntoView({block:'start'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),2200);}});}else window.scrollTo(0,0);
}
function blockHTML(b,i,target){
 if(filter!=='all' && b.role!==filter && b.type!=='h')return '';
 if(b.type==='h')return `<h2 class="section-heading" id="block-${i}">${escape(b.text)}</h2>`;
 if(b.type==='list')return `<div class="list-block" id="block-${i}">${b.items.map(t=>`<p>${textHTML(t)}</p>`).join('')}</div>`;
 if(b.type==='form')return `<div class="list-block" id="block-${i}"><textarea aria-label="Рабочая форма" readonly style="width:100%;min-height:${b.items.length*34}px;border:0;resize:vertical;font-family:inherit;font-size:15px;line-height:1.8;background:white;color:var(--ink)">${escape(b.text)}</textarea><button class="secondary" data-copy="${i}">Копировать форму</button></div>`;
 if(b.type==='table')return `<div id="block-${i}">${renderTable(b.rows)}</div>`;
 const early=i<2&&b.role!=='source';
 return `<details class="block ${b.role}" id="block-${i}" ${(early||target===i)?'open':''}><summary><span><span class="kind">${names[b.role]}</span><span class="title">${escape(compact(b.text))}</span></span></summary><div class="body">${textHTML(b.text)}</div></details>`;
}
function route(){const m=location.hash.match(/^#lesson-(\d+)(?:-block-(\d+))?$/);if(m&&lessons[+m[1]])lesson(+m[1],m[2]!==undefined?+m[2]:undefined);else home();}
function showSearch(q){selected=null;setNav();const value=q.trim().toLocaleLowerCase('ru');if(!value){route();return;}const matches=[];for(const l of lessons){for(let i=0;i<l.blocks.length;i++){const b=l.blocks[i];if(b.text.toLocaleLowerCase('ru').includes(value))matches.push({l,b,i});}}const snippets=matches.map(({l,b,i})=>{const p=b.text.toLocaleLowerCase('ru').indexOf(value),start=Math.max(0,p-75),end=Math.min(b.text.length,p+value.length+140);const raw=b.text.slice(start,end);const a=p-start;const snippet=(start?'…':'')+escape(raw.slice(0,a))+`<mark class="hit">${escape(raw.slice(a,a+q.trim().length))}</mark>`+escape(raw.slice(a+q.trim().length))+(end<b.text.length?'…':'');return `<button class="result" data-result="${l.id}:${i}"><small>${escape(l.short)} · ${names[b.role]}</small><b>${escape(compact(b.text))}</b><p>${snippet}</p></button>`;}).join('');content.innerHTML=`<div class="results"><p class="eyebrow">Поиск по всему материалу</p><h1 style="font-size:32px">${escape(q.trim())}</h1><p class="reading-note">${matches.length?'Найдено фрагментов: '+matches.length+'. Открой результат, чтобы увидеть его в контексте урока.':'Ничего не найдено. Попробуй другое слово: «родитель», «страх», «доверие», «сметы».'}</p>${snippets||'<div class="empty">Совпадений нет</div>'}</div>`;window.scrollTo(0,0);}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;
 if(el.hasAttribute('data-home')||el.id==='homebtn')go(null);
 if(el.hasAttribute('data-lesson'))go(+el.dataset.lesson);
 if(el.hasAttribute('data-result')){const [id,b]=el.dataset.result.split(':').map(Number);go(id,b);}
 if(el.hasAttribute('data-filter')){filter=el.dataset.filter;const scroll=window.scrollY;lesson(selected);window.scrollTo(0,scroll);}
 if(el.hasAttribute('data-copy')){const field=el.closest('.list-block').querySelector('textarea');field.select();try{if(navigator.clipboard)navigator.clipboard.writeText(field.value).then(()=>{el.textContent='Скопировано';}).catch(()=>{el.textContent='Текст выделен — скопируй';});else el.textContent=document.execCommand('copy')?'Скопировано':'Текст выделен — скопируй';}catch{el.textContent='Текст выделен — скопируй';}}
 if(el.id==='expand'){const blocks=[...content.querySelectorAll('details')],open=blocks.some(x=>!x.open);blocks.forEach(x=>x.open=open);el.textContent=open?'Свернуть все блоки':'Раскрыть все блоки';}
 if(el.hasAttribute('data-jump'))document.getElementById('block-'+el.dataset.jump)?.scrollIntoView({block:'start'});
 if(el.hasAttribute('data-sources')){const all=[...content.querySelectorAll('.source')];all.forEach(x=>x.open=true);all[0]?.scrollIntoView({block:'start'});}
 if(el.id==='menu'){const show=!sidebar.classList.contains('show');sidebar.classList.toggle('show',show);document.getElementById('cover').classList.toggle('show',show);el.setAttribute('aria-expanded',String(show));}
});
let timer;search.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>showSearch(search.value),150);});document.getElementById('cover').addEventListener('click',closeNav);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNav();});window.addEventListener('hashchange',route);window.addEventListener('beforeprint',()=>content.querySelectorAll('details').forEach(x=>x.open=true));route();
</script></body></html>

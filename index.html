sform:uppercase;letter-spacing:.7px;color:var(--muted);display:block;margin-bottom:5px}.block .title{font-weight:650;font-size:16px;line-height:1.4;display:block}.block .body{padding:0 22px 22px;font-size:17px;line-height:1.75;overflow-wrap:anywhere}.block.example{border-left:4px solid #e5ae49}.block.jkids{border-left:4px solid #7558cb}.block.practice{border-left:4px solid #679b36}.block.source{background:#f8faff}.block.source .body{font-size:14px;color:var(--muted)}.block summary:has(.kind){align-items:start}.list-block{background:white;border:1px solid var(--line);border-radius:12px;margin:12px 0;padding:22px 26px}.list-block p{margin:9px 0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:white;margin-bottom:16px}table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.55}th,td{padding:15px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}th{background:#edf1f8;font-size:12px}tr:last-child td{border-bottom:0}.lesson-bottom{display:flex;justify-content:space-between;gap:14px;border-top:1px solid var(--line);padding-top:24px;margin-top:30px}.secondary{border:1px solid var(--line);background:white;border-radius:9px;padding:12px 17px;font-size:14px}.empty{background:#fff;border:1px dashed #cad3e1;border-radius:12px;padding:30px;text-align:center;color:var(--muted)}.results{max-width:900px}.result{display:block;width:100%;background:white;border:1px solid var(--line);border-radius:12px;text-align:left;padding:22px;margin-bottom:12px}.result small{display:block;color:var(--blue);font-size:12px;margin-bottom:7px}.result b{display:block;font-size:18px;margin-bottom:9px}.result p{font-size:14px;color:var(--muted);margin:0}.hit{background:#e5f6b9;color:var(--ink);padding:1px 2px}.reading-note{font-size:13px;color:var(--muted);margin:12px 0}.flash{outline:3px solid var(--blue)}.mobile-nav-cover{display:none}.footer{font-size:12px;color:var(--muted);margin-top:40px;max-width:800px}.print-only{display:none}@ <script id="content-data" type="application/json">[{"id": 0, "title": "Как пользоваться методичкой", "blocks": [{"type": "p", "text": "Практический маркетинг для команды JKids", "role": "theory"}, {"type": "p", "text": "Подробная методичка по лекции А Старт", "role": "theory"}, {"type": "p", "text": "Как понять покупателя, сформулировать предложение, подготовить контент и проверить результат", "role": "theory"}, {"type": "p", "text": "Эта методичка предназначена для команды, которая осваивает маркетинг на практике. Её задача: помочь пройти путь от «надо что-нибудь опубликовать» до понятного решения: кому мы обращаемся, что человеку важно, почему он может отказаться, чем мы подтверждаем предложение и какое действие хотим получить.", "role": "theory"}, {"type": "p", "text": "Главная мысль лекции: работа начинается с клиента и причины покупки. Каналы, красивые материалы и рекламные кабинеты выбирают после этого. Результат нужно заранее определить и затем проверить. Охваты полезны, когда понятно, как они помогают бизнесу.", "role": "theory"}, {"type": "h", "text": "Как пользоваться методичкой", "role": "theory"}, {"type": "p", "text": "Сначала прочитайте разделы 1–10. Они объясняют, что исследовать и как превращать сведения о клиенте в предложение. Затем используйте разделы 11–16 при подготовке материалов и проверок. Разделы 17–19 содержат рабочие формы, задания и карту источников. Формы можно переносить в существующие задачи команды; новую обязательную систему отчётности заводить не нужно.", "role": "theory"}, {"type": "p", "text": "В тексте используются три обозначения. «Из лекции» означает пересказ предоставленной записи. «Пример лектора» означает рассказанный им случай: это иллюстрация, а не независимо проверенная статистика. «Применение к JKids» и «Рабочее задание» означают редакторскую адаптацию для нашей команды. Придуманные учебные формулировки не являются цитатами родителей или готовыми обещаниями школы.", "role": "theory"}, {"type": "p", "text": "Источники: «лекция-про-маркетинг-1.docx» и «Лекция маркетинг 2.txt», а также три фотографии слайдов. Первая запись начинается с собственного нуля и продолжается примерно до 1:13:46; вторая имеет отдельную шкалу времени и длится примерно 46 минут. Обозначения «часть 1» и «часть 2» всегда относятся к этим двум файлам. Номера Speaker не позволяют надёжно установить личности всех говорящих. Фотографии показывают слайды; отдельного рукописного конспекта среди полученных материалов нет.", "role": "source"}, {"type": "p", "text": "Расшифровка местами повреждена. Точные названия, цифры и обещания, которые нельзя уверенно восстановить, не достраиваются по догадке. Исторические оценки каналов сохраняются как позиция лектора. Юридическое уточнение в разделе 14 приведено отдельно от лекции.", "role": "theory"}], "short": "Как читать", "desc": "Что взято из лекции, а что предложено для JKids"}, {"id": 1, "title": "Зачем бизнесу маркетинг", "blocks": [{"type": "p", "text": "Из лекции. Лектор связывает маркетинг с прибылью и задаёт два основных вопроса: кто наш клиент и что он покупает. Технологически сильный продукт может не продаваться, если людям не нужно то, что он предлагает. Поэтому прежде, чем выбирать рекламный инструмент, нужно разобраться в потребности.", "role": "theory"}, {"type": "p", "text": "Для начинающего маркетолога это означает: публикация сама по себе не доказывает, что работа помогла бизнесу. Материал должен иметь задачу. Он может помочь человеку увидеть проблему, сравнить способы решения, понять продукт или убедиться, что компании можно доверять. На каждом этапе полезное действие будет своим.", "role": "theory"}, {"type": "p", "text": "В начале лекции обсуждаются изменения рекламной среды: прежняя привычная связка социальных сетей и рекламы перестала быть универсальным ответом. Лектор говорит о возвращении интереса к PR и изданиям, новых площадках и банковских рекламных инструментах. Это контекст его выступления, а не инструкция немедленно закупать рекламу на перечисленных площадках.", "role": "theory"}, {"type": "p", "text": "Применение к JKids. До создания поста нужно сформулировать: «Мы обращаемся к такой семье, у которой есть такая задача; показываем такой факт; предлагаем такой следующий шаг». Если заполнить это невозможно, проблема находится раньше написания текста.", "role": "jkids"}, {"type": "p", "text": "Рабочее задание. Возьмите последний материал команды. Запишите, кому он предназначен, что человек должен понять и какое действие сможет совершить. Если есть только «повысить узнаваемость», уточните, среди кого и как узнаваемость будет проверяться. Не переписывайте весь контент-план: разберите один материал.", "role": "practice"}, {"type": "p", "text": "Источник: часть 1, 00:01:49–00:05:31 и 00:06:16–00:07:26.", "role": "source"}], "short": "Зачем маркетинг", "desc": "Связать публикации с задачей бизнеса"}, {"id": 2, "title": "Кто считается клиентом и почему всем нельзя говорить одинаково", "blocks": [{"type": "p", "text": "Из лекции. В B2C бизнес работает с конечными потребителями; в B2B покупку делает организация, но договариваться всё равно приходится с людьми. Их личные задачи, ответственность и положение влияют на решение. Внешние взаимодействия шире оплаченной покупки: бизнесу нужно убеждать партнёров, подрядчиков, администрацию. Внутренние клиенты тоже упоминаются, но отдельной подробной модели для них в записи нет.", "role": "theory"}, {"type": "p", "text": "Лектор различает несколько групп по отношениям с продуктом. Это помогает выбирать действие, а не писать одно обращение для всей базы.", "role": "theory"}, {"type": "table", "rows": [["Группа из лекции", "Что о ней известно", "Какую задачу разбираем"], ["Действующие клиенты", "Уже была хотя бы одна оплаченная сделка", "Использование, продолжение, повторная покупка"], ["Бывшие клиенты", "Покупали и прекратили", "Причина ухода и возможность возвращения"], ["Тёплые лиды", "Совершили значимое действие перед покупкой", "Что мешает следующему шагу"], ["Клиенты конкурентов", "Уже решают задачу другим продуктом", "Достаточна ли причина сменить решение"], ["Нереализованный спрос", "Пока не пользуются решением или не осознали потребность", "Есть ли задача и готовность её решать"], ["Покупатели без сильной привязанности", "Важнее решить задачу, чем выбрать определённый бренд", "Удобство и понятность выбора"], ["Принципиальные покупатели", "Есть убеждение или сильное предпочтение", "Совместим ли продукт с их критериями"], ["Нестандартные пользователи", "Применяют продукт неожиданным способом", "Какую задачу он решает в действительности"]], "text": "Группа из лекции Что о ней известно Какую задачу разбираем Действующие клиенты Уже была хотя бы одна оплаченная сделка Использование, продолжение, повторная покупка Бывшие клиенты Покупали и прекратили Причина ухода и возможность возвращения Тёплые лиды Совершили значимое действие перед покупкой Что мешает следующему шагу Клиенты конкурентов Уже решают задачу другим продуктом Достаточна ли причина сменить решение Нереализованный спрос Пока не пользуются решением или не осознали потребность Есть ли задача и готовность её решать Покупатели без сильной привязанности Важнее решить задачу, чем выбрать определённый бренд Удобство и понятность выбора Принципиальные покупатели Есть убеждение или сильное предпочтение Совместим ли продукт с их критериями Нестандартные пользователи Применяют продукт неожиданным способом Какую задачу он решает в действительности", "role": "theory"}, {"type": "p", "text": "Пример лектора. Для автосалона тест-драйв является значимым действием; для продажи квартиры таким действием может быть просмотр. Поэтому «посмотрел пост» и «всерьёз попробовал продукт» не стоит автоматически считать одинаковой готовностью.", "role": "example"}, {"type": "p", "text": "Пример лектора. Он рассказывает, что вернуть клиента после конфликта ему не удавалось, а после спокойного расставания работать снова проще. Это его опыт, а не доказательство невозможности возвращения любого клиента.", "role": "example"}, {"type": "p", "text": "Пример лектора. В рассказе о подгузниках водители использовали их для сбора влаги под ковриком автомобиля. Источник исследования лектор не помнит; долю рынка из этого рассказа использовать нельзя. Смысл случая: назначение, придуманное производителем, может отличаться от причины реального использования.", "role": "example"}, {"type": "p", "text": "Применение к JKids. Подписчик, участник бесплатного марафона и покупатель курса должны различаться. Бесплатное участие не становится оплатой. Для тёплого лида нужно определить собственное значимое действие и проверить, связано ли оно с последующим обращением. Например, выполненное задание с обсуждением условий обучения может быть кандидатом на такое действие, но пока это гипотеза.", "role": "jkids"}, {"type": "p", "text": "Рабочее задание. Разделите доступные контакты по фактическим действиям. Если данных нет, напишите «неизвестно». Не присваивайте «горячий» только потому, что человек ставит реакции.", "role": "practice"}, {"type": "p", "text": "Источник: часть 1, 00:07:26–00:14:06.", "role": "source"}], "short": "Типы клиентов", "desc": "Различать подписчика, лида и покупателя"}, {"id": 3, "title": "Что такое LTV и зачем смотреть на продолжение отношений", "blocks": [{"type": "p", "text": "Из лекции. LTV используется как показатель денег, которые клиент приносит за период отношений с бизнесом. Лектор предлагает различать людей, которые пользуются услугой один месяц, полгода или несколько лет: работать с ними нужно с учётом этого поведения.", "role": "theory"}, {"type": "p", "text": "Пример лектора. Посетитель спортзала ходит шесть месяцев подряд, затем делает перерыв. В расчётной фразе записи фигурирует 2 000 рублей в месяц: 2 000 × 6 = 12 000 рублей за этот цикл. Рядом распознано и 3 000 рублей, поэтому исходная речь не даёт единой надёжной суммы абонемента. В методичке сохранён смысл расчёта, а не утверждение о цене конкретного зала.", "role": "example"}, {"type": "p", "text": "Редакторское пояснение. Нужно явно называть, что именно мы считаем: поступившую выручку за период, ожидаемую выручку или прибыль с учётом расходов. Эти величины отличаются. Пример лекции описывает упрощённую выручку, а не допустимый рекламный бюджет на привлечение.", "role": "theory"}, {"type": "p", "text": "Применение к JKids. Если курс покупают один раз, нельзя без основания включить в расчёт ещё три будущих курса. Пока продолжение не наблюдалось, это предположение. Для первых продаж полезно отдельно видеть: оплатил ли человек, начал ли ребёнок, что закончил, почему остановился и было ли следующее обращение.", "role": "jkids"}, {"type": "p", "text": "Рабочее задание. По реальным покупателям, когда они появятся, соберите фактические платежи и период отношений. Отдельно отмечайте возвраты. Сначала добейтесь правильного учёта, потом делайте прогнозы.", "role": "practice"}, {"type": "p", "text": "Источник: часть 1, 00:09:16–00:10:54.", "role": "source"}], "short": "LTV и повторные покупки", "desc": "Смотреть на весь период отношений"}, {"id": 4, "title": "Как описать покупателя так чтобы это помогало работе", "blocks": [{"type": "p", "text": "Из лекции. Возраст, пол и доход могут быть полезны, но сами по себе не объясняют покупку. Лектор обращает внимание на желания, проблемы, социальный статус, семейное положение, интересы, окружение, участников решения и удобный способ общения.", "role": "theory"}, {"type": "p", "text": "Его пример: человек моложе может быть обеспеченнее старшего. Поэтому описание «мужчина 35 лет» нельзя автоматически превращать в «состоявшийся и платёжеспособный». Аналогично наличие ребёнка меняет задачи семьи, но не даёт готового ответа, какое обучение она выберет.", "role": "theory"}, {"type": "p", "text": "Рабочая форма адаптирована из лекции. Она не требует придумывать красивую биографию персонажа. Заполняйте только то, что влияет на выбор и подтверждается данными.", "role": "theory"}, {"type": "table", "rows": [["Что выяснить", "Для чего это нужно", "Как записать без выдумки"], ["Конкретная задача", "Понять причину поиска", "Ситуация и слова человека"], ["Желаемое изменение", "Сформулировать результат", "Что должно стать иначе"], ["Трудность", "Понять, почему не справился", "Что уже пробовал и где остановился"], ["Альтернативы", "Увидеть реальный выбор", "Что сравнивал, выбрал или отверг"], ["Участники решения", "Подготовить аргументы каждому", "Кто предложил, обсуждал, платил"], ["Прошлый опыт", "Найти ожидания и недоверие", "Конкретный случай и последствия"], ["Страх покупки", "Подготовить проверяемое доказательство", "Чего опасается и почему"], ["Канал общения", "Сделать контакт удобным", "Как общался в последней похожей покупке"], ["Жизненный контекст", "Увидеть ограничения", "Время, техника, расписание, семья"]], "text": "Что выяснить Для чего это нужно Как записать без выдумки Конкретная задача Понять причину поиска Ситуация и слова человека Желаемое изменение Сформулировать результат Что должно стать иначе Трудность Понять, почему не справился Что уже пробовал и где остановился Альтернативы Увидеть реальный выбор Что сравнивал, выбрал или отверг Участники решения Подготовить аргументы каждому Кто предложил, обсуждал, платил Прошлый опыт Найти ожидания и недоверие Конкретный случай и последствия Страх покупки Подготовить проверяемое доказательство Чего опасается и почему Канал общения Сделать контакт удобным Как общался в последней похожей покупке Жизненный контекст Увидеть ограничения Время, техника, расписание, семья", "role": "theory"}, {"type": "p", "text": "Пример лектора. В продаже квартиры он различает человека, влияющего на выбор, и человека, оплачивающего покупку. Прозвучавшее распределение между супругами относится к его примеру; автоматически переносить его на каждую семью нельзя.", "role": "example"}, {"type": "p", "text": "Применение к JKids. У ребёнка может быть желание сделать красивую модель или показать результат друзьям. У родителя может быть задача найти интересное занятие, увидеть развитие или выбрать формат без поездок. Это возможные мотивы, которые выясняются отдельно. Возраст 10–13 лет сейчас является рабочим фокусом интервью, а не уже доказанным коммерческим сегментом.", "role": "jkids"}, {"type": "p", "text": "Рабочее задание. После интервью выпишите одну фактическую историю выбора. Рядом отделите выводы команды от слов родителя. Если он говорил о дороге до кружка, не заменяйте это утверждением «всем нужен онлайн».", "role": "practice"}, {"type": "p", "text": "Источник: часть 1, 00:14:20–00:24:13.", "role": "source"}], "short": "Портрет покупателя", "desc": "Понять выбор, а не придумать персонажа"}, {"id": 5, "title": "Российский контекст и момент когда человек начинает действовать", "blocks": [{"type": "p", "text": "Из лекции. Лектор описывает две мотивации: стремление получить желаемое и стремление избавиться от неприятного. Его образ: «морковка спереди» и «морковка сзади». Для российской аудитории он особо подчёркивает действие после возникшей неприятности, а не заранее.", "role": "theory"}, {"type": "p", "text": "Пример лектора. При обсуждении страхования дачи он связывает решение со случаем пожара, взлома или повреждения у владельца либо в его окружении. Это наблюдение из выступления, а не измеренное правило для всех россиян.", "role": "example"}, {"type": "p", "text": "Практический смысл: полезно выяснить событие, которое запускает поиск. Недостаточно знать, что человек в целом хотел бы улучшить жизнь. Нужно понять, что случилось перед решением действовать, почему раньше откладывал и что изменилось.", "role": "theory"}, {"type": "p", "text": "Лектор упоминает книгу «Русская модель управления» Александра Прохорова. Название восстанавливается по ответу из аудитории в записи. Это рекомендация лектора для чтения, содержание книги в предоставленную лекцию целиком не входит.", "role": "theory"}, {"type": "p", "text": "Применение к JKids. Возможные события для проверки: ребёнок сам попросил новое занятие; прежний кружок перестал подходить; семье стало неудобно ездить; ребёнок попробовал делать что-то и захотел помощь. Эти события придуманы как направления исследования, а не установлены для нашей аудитории.", "role": "jkids"}, {"type": "p", "text": "Рабочие вопросы для разбора уже проведённого интервью: «После какого события начали искать? Что делали до этого? Почему откладывали? Что случилось бы, если ничего не менять?» Они дополняют анализ результатов и не заменяют утверждённый скрипт кастдева.", "role": "theory"}, {"type": "p", "text": "Редакторское ограничение. Из идеи о запуске действия не следует, что нужно запугивать родителей или создавать ложную проблему. Показывать надо реальную ситуацию и её последствия. Мотив «быть хорошим родителем» можно раскрывать через понятную поддержку ребёнка; внушать, что без покупки человек плохой родитель, не нужно.", "role": "theory"}, {"type": "p", "text": "Источник: часть 1, 00:14:52–00:18:05 и 00:56:24–00:57:47.", "role": "source"}, {"type": "h", "text": "Как выбирать удобный способ общения", "role": "theory"}, {"type": "p", "text": "Из лекции. Лектор предпочитает звонок и личный просмотр. По наблюдениям его агентства более молодые посетители чаще пишут, старшие чаще звонят, особенно при сложном продукте. Поэтому единственный чат может создавать препятствие для части аудитории.", "role": "theory"}, {"type": "p", "text": "Это не основание жёстко разделять людей по возрасту. Практический вывод: выяснить привычный способ контакта и обеспечить путь, который команда действительно может обслуживать. Если есть возможность звонка, должно быть ясно, как договориться. Если есть чат, в нём нужно отвечать.", "role": "theory"}, {"type": "p", "text": "Применение к JKids. Можно проверять выбор между перепиской и коротким разговором о формате. Не обещать круглосуточную поддержку, если её нет. Если родитель не оставляет заявку, сначала выяснить, понял ли он предложение и удобно ли ему связаться, а не автоматически считать отсутствие спроса.", "role": "jkids"}, {"type": "p", "text": "Источник: часть 1, 00:18:05–00:19:17.", "role": "source"}], "short": "Момент решения", "desc": "Выяснить, почему человек начал действовать"}, {"id": 6, "title": "Проблема трудность ожидание и прошлое разочарование", "blocks": [{"type": "p", "text": "Из лекции. Лектор предлагает последовательно выяснить: какую задачу хочет решить клиент; что мешает ему решить её; каких изменений он ждёт от использования; чем был недоволен в аналогичном продукте; как принимает решение.", "role": "theory"}, {"type": "p", "text": "Эти сведения нельзя смешивать. «Хочу найти занятие» описывает задачу. «Не можем ездить три раза в неделю» описывает ограничение. «Хочу видеть, что ребёнок делает сам» описывает ожидаемое изменение. «В прошлом курсе давали видео и не отвечали» описывает опыт, из которого может возникнуть недоверие.", "role": "theory"}, {"type": "p", "text": "Пример лектора. Он предложил томской строительной компании услуги, похожие на услуги уже работающего подрядчика. Причины перейти сначала не было. Позже компания выбрала его из-за быстрой доставки документов: действующий подрядчик отправлял их медленнее. В записи часть деталей повреждена, но связка «документы → удобство работы → выбор подрядчика» читается ясно.", "role": "example"}, {"type": "p", "text": "Почему этот пример важен: превосходство в основной услуге может быть не единственным критерием. Клиент оценивает весь опыт взаимодействия, включая то, что команда считает мелочью. Ускорение документооборота оказалось ценнее одинаковых рекламных обещаний.", "role": "theory"}, {"type": "p", "text": "Другие примеры лектора: человек ждёт изменений тела или здоровья от занятий; покупатель робота-газонокосилки ждёт результат на газоне. Покупают ожидаемое изменение, а не только перечень функций. Неудачный опыт с маркетологом может переноситься в недоверие к профессии; похожая логика касается товаров-заменителей.", "role": "example"}, {"type": "p", "text": "Применение к JKids. Удобство может находиться в установке Blender, расписании, способе получить помощь, ясности задания и понятном сообщении о прогрессе. Какие из этих вещей важны родителям, ещё нужно выяснить. Нельзя приписывать всем главную боль «ребёнок застревает без помощи»: она пока не выбрана как основная причина покупки.", "role": "jkids"}, {"type": "p", "text": "Рабочее задание. Для одной истории составьте пять отдельных предложений: задача; препятствие; желаемое изменение; прошлое разочарование; способ принятия решения. Каждое предложение должно ссылаться на реальный разговор или быть помечено «гипотеза».", "role": "practice"}, {"type": "p", "text": "Источник: часть 1, 00:24:47–00:30:49.", "role": "source"}], "short": "Задача и ожидания", "desc": "Отделить цель клиента от препятствий"}, {"id": 7, "title": "Почему человек боится покупать", "blocks": [{"type": "p", "text": "Из лекции. Страхи и возражения влияют на отказ. Лектор выделяет функциональные, финансовые, временные, физические, психологические и социальные риски. Чтобы подготовить предложение, их сначала нужно обнаружить.", "role": "theory"}, {"type": "table", "rows": [["Риск", "Что человек может потерять", "Учебная гипотеза для JKids", "Чем можно отвечать если это реально есть"], ["Функциональный", "Продукт не выполнит задачу", "Ребёнок не сможет учиться в таком формате", "Показ настоящего задания и реального процесса"], ["Финансовый", "Деньги или дополнительные расходы", "Оплатим, а ребёнок бросит; понадобится другая техника", "Ясные условия, требования и состав оплаты"], ["Потеря времени", "Время на выбор и использование", "Родителю придётся постоянно организовывать обучение", "Реальное описание участия родителя"], ["Физический", "Здоровье или безопасность", "Опасения из-за нагрузки и времени у экрана", "Фактический режим занятий без медицинских обещаний"], ["Психологический", "Комфорт и отношение к себе", "Ребёнок сочтёт себя неспособным после неудачи", "Показ того, как преподаватель работает с ошибкой"], ["Социальный", "Мнение других и положение в группе", "Ребёнок боится выглядеть хуже остальных", "Реальные правила общения и примеры обратной связи"]], "text": "Риск Что человек может потерять Учебная гипотеза для JKids Чем можно отвечать если это реально есть Функциональный Продукт не выполнит задачу Ребёнок не сможет учиться в таком формате Показ настоящего задания и реального процесса Финансовый Деньги или дополнительные расходы Оплатим, а ребёнок бросит; понадобится другая техника Ясные условия, требования и состав оплаты Потеря времени Время на выбор и использование Родителю придётся постоянно организовывать обучение Реальное описание участия родителя Физический Здоровье или безопасность Опасения из-за нагрузки и времени у экрана Фактический режим занятий без медицинских обещаний Психологический Комфорт и отношение к себе Ребёнок сочтёт себя неспособным после неудачи Показ того, как преподаватель работает с ошибкой Социальный Мнение других и положение в группе Ребёнок боится выглядеть хуже остальных Реальные правила общения и примеры обратной связи", "role": "theory"}, {"type": "p", "text": "Примеры лектора. Некачественная покупка может привести к потере денег и долгому возврату. Встреча и даже сама лекция несут риск потери времени. Он рассказывает о пожаре в собственном доме и показывает, что один случай затрагивает разные виды риска. Психологический риск относится к переживанию внутри себя, социальный к тому, как оценят другие. Для последнего он приводит внешность, одежду и причёску.", "role": "theory"}, {"type": "p", "text": "Практический порядок адаптирован для команды: обнаружить страх в словах человека; понять его основание; найти факт, который отвечает именно на него; показать этот факт до покупки; проверить, остался ли вопрос.", "role": "theory"}, {"type": "p", "text": "Плохой ответ на страх «онлайн уже бросили»: «У нас лучшие преподаватели». Здесь нет объяснения, чем новый опыт будет отличаться. Более полезное действие: показать конкретную работу преподавателя и устройство обучения, затем спросить, какое сомнение осталось. Если нужной поддержки нет, сначала решать вопрос продукта.", "role": "theory"}, {"type": "p", "text": "Из лекции, обсуждение детских курсов. Лектор рекомендует разбирать проблемы и страхи родителей, при этом учитывать ребёнка. Родитель оплачивает и оценивает пользу, но ребёнок будет пользоваться продуктом. В записи упоминаются профессия и будущее. Это предложенное направление аргументации, а не доказательство, что наш курс уже обеспечивает профессиональный результат.", "role": "theory"}, {"type": "p", "text": "Рабочее задание. Выберите один подтверждённый страх. Найдите подходящее доказательство среди существующих материалов. Если нет, сформулируйте запрос на материал: что именно показать и какой вопрос это закроет. Не сочиняйте отзыв вместо доказательства.", "role": "practice"}, {"type": "p", "text": "Источник: часть 1, 00:30:49–00:38:11.", "role": "source"}], "short": "Страхи покупки", "desc": "Найти сомнение и подобрать доказательство"}, {"id": 8, "title": "С кем мы конкурируем на самом деле", "blocks": [{"type": "p", "text": "Из лекции. Сильный конкурент часто находится в выборе между «делать» и «не делать». Человеку может быть проще ничего не менять. Тогда сравнение с другой компанией не решает его главный вопрос: зачем действовать вообще.", "role": "theory"}, {"type": "p", "text": "Пример лектора. При продаже родителю занятия сначала может потребоваться показать, почему стоит решать задачу. Рассказ о преимуществах своей школы имеет смысл после того, как для родителя появилась сама причина выбора.", "role": "example"}, {"type": "p", "text": "Применение к JKids. В исследовании нужно учитывать не только школы Blender. Возможными альтернативами могут быть офлайн-кружок, занятия по другой теме, самостоятельные ролики, игры, совместные семейные занятия или отсутствие нового занятия. Это перечень для проверки. Реальными конкурентами становятся те варианты, которые конкретная семья действительно рассматривает.", "role": "jkids"}, {"type": "p", "text": "Рабочее задание. По одному разговору запишите три вещи: что семья могла выбрать; почему выбрала или отложила; что оказалось важнее нашего описания продукта. Не называйте конкурента только потому, что он продаёт похожий курс.", "role": "practice"}, {"type": "p", "text": "Источник: часть 1, 00:38:11–00:39:57.", "role": "source"}, {"type": "h", "text": "Новая гипотеза из разговора о семье", "role": "theory"}, {"type": "p", "text": "Случай из записи. Участник рассказывает, что живёт с дочерью в разных городах. Ему важно проводить с ней содержательное время и выстраивать близость. Он ищет совместную активность, где ребёнку интересно, а родитель участвует в процессе. Просто готовый результат и последующий показ родителю не полностью отвечают его запросу.", "role": "example"}, {"type": "p", "text": "В разговоре обсуждаются игры, уроки и создание моделей. Существенная поправка самого участника: ему нужно взаимодействовать во время обучения. Значит, исходная задача может находиться в отношениях, а не только в освоении 3D.", "role": "theory"}, {"type": "p", "text": "Гипотеза для JKids. Совместное творчество онлайн может представлять ценность для части семей, включая живущих раздельно. Это отдельное направление проверки. Один разговор не подтверждает размер аудитории, рост сегмента, готовность платить или необходимость переделывать весь курс.", "role": "jkids"}, {"type": "p", "text": "Рабочее задание. Сохранить гипотезу в общем разборе исследования и проверить реальные попытки совместного досуга у нескольких подходящих семей. Не добавлять в рекламу обещание «сблизим вас с ребёнком», пока нет соответствующего формата и результатов.", "role": "practice"}, {"type": "p", "text": "Источник: часть 1, 00:41:59–00:46:30. Данные о росте разводов и размере рынка в разговоре не подтверждены источниками.", "role": "source"}], "short": "Конкуренты и бездействие", "desc": "Учитывать выбор ничего не покупать"}, {"id": 9, "title": "Как перевести мотив покупки в понятную выгоду", "blocks": [{"type": "p", "text": "Из лекции. На слайдах представлен список «50 причин, по которым люди совершают покупки». Лектор предупреждает, что общие формулировки не работают в чистом виде: их нужно раскрывать применительно к продукту. Для своей работы предлагает выбрать примерно 5–7 наиболее важных причин.", "role": "theory"}, {"type": "p", "text": "На предоставленной фотографии читаются первые 16 пунктов. Остальные слайды полного списка не переданы. Ниже воспроизведена именно доступная часть без дополнения до пятидесяти.", "role": "theory"}, {"type": "list", "text": "1. Заработать деньги.\n2. Сэкономить деньги.\n3. Сэкономить время.\n4. Быть успешным и популярным.\n5. Получить конкурентное преимущество.\n6. Получить удовольствие.\n7. Коллекционировать ценные и редкие вещи.\n8. Привлечь внимание противоположного пола.\n9. Быть модным и стильным.\n10. Устранить боль.\n11. Осуществить мечту.\n12. Повысить своё мастерство или показатели работы.\n13. Получить преимущества перед другими.\n14. Удовлетворить аппетит.\n15. Упростить свой труд.\n16. Удовлетворить любопытство.", "items": ["1. Заработать деньги.", "2. Сэкономить деньги.", "3. Сэкономить время.", "4. Быть успешным и популярным.", "5. Получить конкурентное преимущество.", "6. Получить удовольствие.", "7. Коллекционировать ценные и редкие вещи.", "8. Привлечь внимание противоположного пола.", "9. Быть модным и стильным.", "10. Устранить боль.", "11. Осуществить мечту.", "12. Повысить своё мастерство или показатели работы.", "13. Получить преимущества перед другими.", "14. Удовлетворить аппетит.", "15. Упростить свой труд.", "16. Удовлетворить любопытство."], "role": "theory"}, {"type": "p", "text": "В речи дополнительно звучат мотивы: заставить других завидовать; стать счастливым; удовлетворить эго; что-то обновить; быть хорошим родителем и супругом; войти в историю. Это дополнения из расшифровки, их номера в полном списке не установлены.", "role": "theory"}, {"type": "p", "text": "Пример лектора. Коллекционирование обсуждается через игрушки из Kinder. Его ребёнок может интересоваться сладкой оболочкой и не открывать игрушку. Вывод: один и тот же приём не имеет одинаковой ценности для всех; интерес может переходить в другой, например цифровой, формат.", "role": "example"}, {"type": "h", "text": "Почему фраза сэкономим время слишком слабая", "role": "theory"}, {"type": "p", "text": "Пример лектора. Вместо «сэкономим время предпринимателя» он разбирает SMM-услугу: исполнитель пишет посты и подбирает изображения, предприниматель тратит около 15 минут в неделю на согласование. Так становится понятно, какую работу забирают и что остаётся клиенту. Эта цифра относится к учебному примеру, а не нормативу для нашей команды.", "role": "example"}, {"type": "p", "text": "Другой мотив для той же услуги: конкурентное преимущество. Лектор предлагает изучить социальные сети конкурентов, понять удачные и слабые стороны и раскрыть, что исполнитель изменит. Участник обсуждения предлагает более доступный автоматизированный продукт и возможную продажу агентствам. Он сам называет это гипотезой; подтверждённой бизнес-моделью случай не становится.", "role": "theory"}, {"type": "p", "text": "Редакторская формула для тренировки: «Для такого человека в такой ситуации мы выполняем такую работу, чтобы он получил такое изменение; это можно показать таким фактом». Она разворачивает смысл лекции и не является дословной формулой лектора.", "role": "theory"}, {"type": "table", "rows": [["Слишком общее обещание", "Что требуется уточнить", "Учебное направление для JKids"], ["Полезное время за компьютером", "Что ребёнок делает и что остаётся", "Показ процесса и конкретной собственной работы"], ["Развиваем творчество", "Какие решения принимает ребёнок", "Выбор формы, деталей или композиции в задании"], ["Удобный онлайн", "Какое неудобство устраняется", "Путь от подключения до получения обратной связи"], ["Навык будущего", "Какой навык и где он проявляется сейчас", "Объяснение работы с 3D и оценки результата без гарантии профессии"], ["Ребёнку интересно", "Чем интерес подтверждён", "Реальное наблюдение, выполненная работа или слова участника"]], "text": "Слишком общее обещание Что требуется уточнить Учебное направление для JKids Полезное время за компьютером Что ребёнок делает и что остаётся Показ процесса и конкретной собственной работы Развиваем творчество Какие решения принимает ребёнок Выбор формы, деталей или композиции в задании Удобный онлайн Какое неудобство устраняется Путь от подключения до получения обратной связи Навык будущего Какой навык и где он проявляется сейчас Объяснение работы с 3D и оценки результата без гарантии профессии Ребёнку интересно Чем интерес подтверждён Реальное наблюдение, выполненная работа или слова участника", "role": "theory"}, {"type": "p", "text": "Применение к JKids. Из доступных мотивов можно исследовать удовольствие, любопытство, мастерство и желание родителя поддержать развитие. Мы не утверждаем, что именно они уже объясняют оплату. Сначала связываем каждый кандидат со словами и действиями семьи.", "role": "jkids"}, {"type": "p", "text": "Рабочее задание. Выберите до семи мотивов-кандидатов, затем для каждого напишите конкретную выгоду и основание. Если выгода звучит одинаково для любой школы, её ещё нужно раскрыть.", "role": "practice"}, {"type": "p", "text": "Источник: часть 1, 00:54:19–01:03:03; фотография «50 причин», файл с фрагментом имени 1863_949.", "role": "source"}, {"type": "h", "text": "Как разбирать сильный заголовок", "role": "theory"}, {"type": "p", "text": "Пример лектора. Он вспоминает баннер о сокращении жира на животе и боках, где были результат в сантиметрах, короткий срок и название американского аппарата. Точный срок он сам не помнит, название аппарата не читается в записи. Это разбор рекламного сообщения, а не подтверждение медицинской эффективности.", "role": "example"}, {"type": "p", "text": "Что лектор в нём выделяет: понятная проблема, конкретное обещание и основание поверить. Техническое название может помогать, если аудитория понимает, что оно означает.", "role": "theory"}, {"type": "p", "text": "Применение к JKids. Название Blender само по себе не объясняет родителю ценность. Нужен понятный результат и демонстрация, почему мы умеем его организовать. Но нельзя придумать срок, количество проектов и гарантированный результат ради сильного заголовка. Сначала подтвердить содержание продукта.", "role": "jkids"}, {"type": "p", "text": "Источник: часть 1, 01:03:03–01:05:18.", "role": "source"}], "short": "Мотивы и выгоды", "desc": "Раскрыть выгоду конкретно"}, {"id": 10, "title": "Три роли в покупке и разные аргументы для каждой", "blocks": [{"type": "p", "text": "Из лекции. Во второй части лектор различает экономического покупателя, технического покупателя и конечного пользователя. Один человек может совмещать роли, особенно в B2C. Важно понять ведущий мотив, а не механически назначить три разных человека.", "role": "theory"}, {"type": "table", "rows": [["Роль", "На что смотрит в примере лекции", "Какой разговор ей нужен"], ["Экономический покупатель", "Сколько вложит, заработает или сэкономит", "Результат и экономическая обоснованность"], ["Технический покупатель", "Совместимость, обслуживание, качество", "Параметры и условия применения"], ["Конечный пользователь", "Удобство ежедневной работы", "Как продукт работает в реальной ситуации"]], "text": "Роль На что смотрит в примере лекции Какой разговор ей нужен Экономический покупатель Сколько вложит, заработает или сэкономит Результат и экономическая обоснованность Технический покупатель Совместимость, обслуживание, качество Параметры и условия применения Конечный пользователь Удобство ежедневной работы Как продукт работает в реальной ситуации", "role": "theory"}, {"type": "p", "text": "Пример лектора. Владелец производства хочет увеличить выпуск продукции. Технический руководитель проверяет обслуживание станка, запчасти и нужное качество. Работнику важно расположение кнопок: если приходится постоянно обходить станок, паспортная производительность может не реализоваться. Игнорирование пользователя способно разрушить ожидаемую выгоду покупателя.", "role": "example"}, {"type": "p", "text": "Пример лектора. При закупке наркозно-дыхательного аппарата значимое влияние имеет анестезиолог: с оборудованием работает он и несёт личную ответственность. Название завода в расшифровке повреждено и здесь не восстанавливается.", "role": "example"}, {"type": "p", "text": "В B2C ведущим мотивом может быть удовольствие или удобство использования, а не экономия. Поэтому говорить всем только о деньгах неправильно. Лектор подчёркивает: причины покупок нужно узнавать у самих клиентов.", "role": "theory"}, {"type": "p", "text": "Применение к JKids. Родитель может одновременно оплачивать, оценивать условия и организовывать занятия. Ребёнок пользуется обучением и может инициировать выбор. Другой взрослый может влиять на решение. Технический вопрос здесь может означать, например, подходит ли компьютер и можно ли подключиться, но распределение ролей нужно выяснять в конкретной семье.", "role": "jkids"}, {"type": "p", "text": "Учебный пример двух сообщений. Ребёнку: «Посмотри, как из простых форм получается такая модель». Родителю: «Вот что ребёнок делает сам и как преподаватель помогает на этом этапе». Это разные входы в один реальный материал. Они не обещают готовую игровую платформу или будущий заработок.", "role": "jkids"}, {"type": "p", "text": "Рабочее задание. Возьмите одну семью или один B2B-контакт. Опишите, кто инициирует, оплачивает, оценивает пригодность, пользуется и может остановить покупку. Для каждой роли подготовьте один важный аргумент и подходящее доказательство.", "role": "practice"}, {"type": "p", "text": "Источник: часть 2, 00:00:00–00:05:26.", "role": "source"}, {"type": "h", "text": "Как говорить об ИИ когда покупатель боится за свою роль", "role": "theory"}, {"type": "p", "text": "Случай из записи. Участник с продуктом автоматизации смет описывает пробное использование на семь дней. После демонстрации клиентам становится ясно, насколько меняется привычная работа. Один из страхов: профессия может исчезнуть. В разговоре предлагают объяснять изменение роли и снятие рутины, а не объявлять человека ненужным.", "role": "example"}, {"type": "p", "text": "Участник заявляет об автоматизации примерно 90% работы и отсутствии галлюцинаций в своём устройстве продукта. Это его заявление о конкретном проекте; оно не проверено и не относится ко всем нейросетям. В том же разговоре уточняется, что продукт не проверяет исходный проект на ошибки так, как может опытный сметчик. Этот предел важно сохранить вместе с обещанием.", "role": "theory"}, {"type": "p", "text": "Применение к JKids. Не строить аргумент на «все профессии исчезнут» или «ИИ всё сделает без знаний». Возможное направление: показать, как человек принимает творческие решения и проверяет результат с инструментами. Но необходимость конкретного обучения и его ценность для семьи всё равно исследуются, а не считаются доказанными общим интересом к ИИ.", "role": "jkids"}, {"type": "p", "text": "Источник: часть 1, 00:46:40–00:53:23. Это разговор участников внутри записи, а не отдельный подтверждённый кейс лектора.", "role": "source"}], "short": "Кто решает и кто пользуется", "desc": "Подготовить разные аргументы участникам"}, {"id": 11, "title": "Лестница готовности к покупке по слайду лекции", "blocks": [{"type": "p", "text": "Из лекции и фотографии. В представленном варианте лестницы Бена Ханта четыре уровня. Важно использовать именно этот вариант: не подменять его другой распространённой схемой с иным числом ступеней.", "role": "theory"}, {"type": "p", "text": "Названия «нет проблемы», «нет решения», «нет продукта» и «нет уверенности» описывают, что ещё не определено у человека. «Нет проблемы» в этой модели означает, что он её не осознаёт или не считает значимой; «нет продукта» означает, что не выбрал конкретный вариант.", "role": "theory"}, {"type": "table", "rows": [["Уровень со слайда", "Поведение клиента", "Задача сообщения", "Что предлагает слайд"], ["1 Нет проблемы", "Ничего не ищет", "Продать проблему", "Показать значимость проблемы; на слайде также указано «запугать»"], ["2 Нет решения", "Ищет способы решения", "Продать категорию", "Показать преимущество категории"], ["3 Нет продукта", "Сравнивает альтернативы", "Продать продукт", "Показать преимущество своего продукта перед конкурентами"], ["4 Нет уверенности", "Ищет подтверждение правильности выбора", "Продать уверенность", "Кейсы, персональные предложения, отзывы"]], "text": "Уровень со слайда Поведение клиента Задача сообщения Что предлагает слайд 1 Нет проблемы Ничего не ищет Продать проблему Показать значимость проблемы; на слайде также указано «запугать» 2 Нет решения Ищет способы решения Продать категорию Показать преимущество категории 3 Нет продукта Сравнивает альтернативы Продать продукт Показать преимущество своего продукта перед конкурентами 4 Нет уверенности Ищет подтверждение правильности выбора Продать уверенность Кейсы, персональные предложения, отзывы", "role": "theory"}, {"type": "p", "text": "Последний столбец передаёт текст слайда. Формулировка «запугать» сохранена как позиция источника. Редакторская адаптация для JKids: показывать реальную проблему и последствия, не выдумывать угрозы и не давить на чувство вины родителя. Основное разделение задач подтверждается второй расшифровкой.", "role": "theory"}, {"type": "p", "text": "Пример лектора. Человек постепенно приходит от отсутствия признанной задачи к выбору способа заниматься, затем конкретного вида занятий и тренера. В записи названия отдельных спортивных вариантов повреждены; ясный смысл: сначала выбор способа решения, затем выбор поставщика и уверенность в нём.", "role": "example"}, {"type": "p", "text": "Пример лектора. Статья о том, как выбрать телевизор, матрицу или размер, рассчитана на человека, который знает категорию, но ещё сравнивает варианты. Так компания помогает выбрать и повышает доверие до покупки.", "role": "example"}, {"type": "p", "text": "Из лекции. Работа на ранних уровнях может требовать много контактов и оказаться дорогой в пересчёте на клиента. На позднем уровне конкурируют за уже сформированный спрос. Лектор не требует каждому стартапу одновременно оплачивать все уровни: предлагает осознанно выбирать, с кем работает сообщение.", "role": "theory"}, {"type": "h", "text": "Как применять четыре уровня к JKids", "role": "theory"}, {"type": "p", "text": "Следующая таблица является учебной адаптацией. Формулировки не взяты из интервью и не подтверждают, что родители действительно думают именно так.", "role": "theory"}, {"type": "table", "rows": [["Уровень", "Возможная ситуация родителя", "Подходящий материал", "Следующий шаг"], ["1", "Сейчас не ищет занятие", "Реальная история творческого интереса ребёнка и возможностей поддержки", "Узнать больше о ситуации"], ["2", "Хочет занятие, сравнивает подходы", "Честный разбор онлайна, офлайна и самостоятельного обучения", "Рассмотреть подходящий формат"], ["3", "Выбирает конкретное обучение", "Показ содержания, требований, преподавателя и отличий", "Посмотреть подробные условия"], ["4", "Заинтересовался JKids, но сомневается", "Реальные работы, процесс, ответы на конкретные вопросы", "Связаться и обсудить условия"]], "text": "Уровень Возможная ситуация родителя Подходящий материал Следующий шаг 1 Сейчас не ищет занятие Реальная история творческого интереса ребёнка и возможностей поддержки Узнать больше о ситуации 2 Хочет занятие, сравнивает подходы Честный разбор онлайна, офлайна и самостоятельного обучения Рассмотреть подходящий формат 3 Выбирает конкретное обучение Показ содержания, требований, преподавателя и отличий Посмотреть подробные условия 4 Заинтересовался JKids, но сомневается Реальные работы, процесс, ответы на конкретные вопросы Связаться и обсудить условия", "role": "theory"}, {"type": "p", "text": "Ошибка: предлагать купить курс человеку, который пока не понял, зачем семье это нужно. Другая ошибка: бесконечно объяснять важность творчества человеку, который уже спрашивает о конкретных условиях и технике.", "role": "theory"}, {"type": "p", "text": "Рабочее задание. Перед написанием материала определите одну ступень. Затем проверьте заголовок, содержание и действие: работают ли они на одну задачу. Не пытайтесь уместить все четыре ступени в каждый короткий ролик.", "role": "practice"}, {"type": "p", "text": "Источник: часть 2, 00:05:30–00:08:20, 00:13:40–00:13:58 и 00:17:23–00:19:41; фотография со слайдом лестницы, файл 1685_989.", "role": "source"}], "short": "Лестница покупки", "desc": "Выбрать задачу сообщения на каждом уровне"}, {"id": 12, "title": "Как показывать доверие до обращения", "blocks": [{"type": "p", "text": "Из лекции. На этапе сомнений важны доказательства, что компания способна выполнить обещание. Лектор рассматривает доверие как ключевую часть выбора. У разных аудиторий основания доверия могут отличаться.", "role": "theory"}, {"type": "p", "text": "Пример лектора. Он рассказывает о дедушке, который доверился газетной публикации и организации с офисом и демонстрацией материалов из знакомых изданий. Покупка оказалась проблемной. История показывает силу привычных сигналов доверия; она не доказывает, что публикация в СМИ делает предложение надёжным. Точные суммы и детали повреждены и не нужны для практического вывода.", "role": "example"}, {"type": "p", "text": "Пример лектора. У компании по продаже контрактных двигателей был чистый, организованный склад. Покупатели представляли условия хранения хуже, чем они были. После того как фотографии и видео реального склада показали на сайте, лектор сообщил о росте конверсии. Коэффициент роста в записи не читается надёжно, поэтому не приводится. Важно, что сильное доказательство уже существовало, но до обращения его не видели.", "role": "example"}, {"type": "p", "text": "Практический вывод: искать подтверждение в самой работе компании. Устройство процесса, реальная среда, демонстрация результата, экспертное объяснение, отзыв и кейс должны отвечать на сомнение, а не просто заполнять раздел «о нас».", "role": "theory"}, {"type": "h", "text": "Что показывать в JKids", "role": "theory"}, {"type": "p", "text": "Применение к JKids. Для доверия можно использовать реальные ученические работы, фрагмент объяснения преподавателя, процесс выполнения задания и честный разбор ошибки. Материал ученика, работа преподавателя и AI-изображение должны быть различимы. Один красивый рендер без происхождения не объясняет, чего добился ребёнок.", "role": "jkids"}, {"type": "p", "text": "Редакторская структура учебного кейса: исходный уровень; задача; процесс; какая помощь была; что сделал сам ученик; итог; трудности и ограничения. Если нет разрешения на публикацию конкретного материала, выбрать другой доступный пример. Нельзя придумывать историю успеха или скрывать, что работу сделал преподаватель.", "role": "theory"}, {"type": "p", "text": "Не называть бесплатный марафон доказательством платного спроса. Он может дать сведения о процессе, заданиях и трудностях. Чтобы заявить конкретные результаты, нужны реальные работы и данные. Не обещать создание персонажа с нуля: в текущем описании курса есть позинг готового персонажа, размещение в сцене и постер.", "role": "theory"}, {"type": "p", "text": "Рабочее задание. Найдите одно сильное доказательство, которое уже есть у школы, но аудитория не видит. Опишите: какой вопрос оно закрывает; где его показать до обращения; чего оно не доказывает. По аналогии со складом двигателей это может оказаться полезнее нового общего рекламного текста.", "role": "practice"}, {"type": "p", "text": "Источник: часть 2, 00:07:52–00:09:45 и 00:10:28–00:15:49.", "role": "source"}, {"type": "h", "text": "Основатель как лицо проекта", "role": "theory"}, {"type": "p", "text": "Из лекции. В конце обсуждаются личный бренд и бренд компании. Лектор предпочитает присутствие основателя, но отмечает значение его человеческого образа и поведения. Если это не помогает позиционированию, может быть уместнее медийность компании. Конкретная история с внешним видом в конце плохо распознана и подробно не восстанавливается.", "role": "theory"}, {"type": "p", "text": "Применение к JKids. Сергей может показывать свою преподавательскую работу и объяснять решения. Это не требует превращать канал в дневник всей личной жизни. Выбирать стоит материал, который помогает ребёнку или родителю понять подход школы. Личный бренд тоже не заменяет содержание продукта.", "role": "jkids"}, {"type": "p", "text": "Источник: часть 2, 00:44:26–00:46:06.", "role": "source"}], "short": "Доверие и доказательства", "desc": "Показать то, что уже есть в работе"}, {"id": 13, "title": "Как выбирать каналы без веры в волшебную площадку", "blocks": [{"type": "p", "text": "Из лекции. Лектор обсуждает инструменты через собственный опыт. Его оценки полезны как направления для изучения, но не доказывают, что канал даст такой же результат JKids. Перед использованием нужно понимать аудиторию, задачу и условия конкретного теста.", "role": "theory"}, {"type": "table", "rows": [["Инструмент", "Что прозвучало в лекции", "Как использовать это в планировании"], ["Яндекс Директ", "Клики дорожают; результат требует оптимизации и времени", "Не ждать гарантированной эффективности первого запуска"], ["PR и медиа", "Возможны кейсы, новости и публикации", "Выбирать издания, которым доверяет нужная аудитория"], ["VK таргет", "Лектор резко критикует результаты в своём опыте", "Считать это мнением, проверить свою задачу отдельно"], ["Авито", "Выделяет как перспективную площадку и говорит о нестабильности", "Изучать конкретный формат и намерение аудитории"], ["Telegram и размещения", "Обсуждает посты в каналах и вопросы оформления рекламы", "Оценивать аудиторию канала и путь после перехода"], ["MAX", "Ожидает развития возможностей", "Не превращать прогноз в обязательный запуск"], ["Охватные публикации", "Упоминаются форматы для узнаваемости", "Заранее назвать нужный охват и его роль"], ["SEO", "Считает рабочим, отмечает конкуренцию", "Работать с реальными вопросами и поисковым спросом"], ["Карты и справочники", "Обсуждает региональные различия, 2ГИС и Яндекс Карты", "Отделять местную услугу от общероссийского онлайна"], ["Вебинары и обучение аудитории", "Говорит об их пользе", "Обучать людей, которым действительно нужен продукт"], ["Виральный контент", "Не считает результат предсказуемым; признаёт, что у других бывает успех", "Не строить план продаж на обещании вирусности"], ["GEO и нейроответы", "Связывает с поисковой оптимизацией и упоминает Алису", "Не обещать цитирование и продажи без проверки"]], "text": "Инструмент Что прозвучало в лекции Как использовать это в планировании Яндекс Директ Клики дорожают; результат требует оптимизации и времени Не ждать гарантированной эффективности первого запуска PR и медиа Возможны кейсы, новости и публикации Выбирать издания, которым доверяет нужная аудитория VK таргет Лектор резко критикует результаты в своём опыте Считать это мнением, проверить свою задачу отдельно Авито Выделяет как перспективную площадку и говорит о нестабильности Изучать конкретный формат и намерение аудитории Telegram и размещения Обсуждает посты в каналах и вопросы оформления рекламы Оценивать аудиторию канала и путь после перехода MAX Ожидает развития возможностей Не превращать прогноз в обязательный запуск Охватные публикации Упоминаются форматы для узнаваемости Заранее назвать нужный охват и его роль SEO Считает рабочим, отмечает конкуренцию Работать с реальными вопросами и поисковым спросом Карты и справочники Обсуждает региональные различия, 2ГИС и Яндекс Карты Отделять местную услугу от общероссийского онлайна Вебинары и обучение аудитории Говорит об их пользе Обучать людей, которым действительно нужен продукт Виральный контент Не считает результат предсказуемым; признаёт, что у других бывает успех Не строить план продаж на обещании вирусности GEO и нейроответы Связывает с поисковой оптимизацией и упоминает Алису Не обещать цитирование и продажи без проверки", "role": "theory"}, {"type": "p", "text": "Названия отдельных площадок и рекламных форматов в повреждённых местах не восстановлены. В частности, не приписываем лектору уверенную рекомендацию канала, название которого распознано неоднозначно.", "role": "theory"}, {"type": "p", "text": "Применение к JKids. Короткие видео могут показывать интересный процесс, но сами по себе не подтверждают обращение родителей. После ролика нужен понятный путь к следующей информации. Для одного теста выбираем конкретную аудиторию, один смысл и обслуживаемое действие. Нельзя одновременно менять всё и затем объяснять результат одной площадкой.", "role": "jkids"}, {"type": "p", "text": "Редакторское пояснение. Рабочая цепочка может выглядеть так: материал → переход → просмотр условий → обращение → обсуждение → оплата. Если цель ранняя, допустимо проверять понятность сообщения или качественные обращения. Но это нужно назвать до запуска, а не после неудавшихся продаж.", "role": "theory"}, {"type": "p", "text": "Рабочее задание. Из двух каналов-кандидатов выберите тот, где можете обосновать наличие нужной аудитории, подготовить подходящий материал и проследить путь к обращению. Напишите причину выбора. Фраза «там сейчас все» основанием не считается.", "role": "practice"}, {"type": "p", "text": "Источник: часть 1, 00:03:27–00:05:31; часть 2, 00:21:16–00:30:47 и 00:35:44–00:36:31.", "role": "source"}, {"type": "h", "text": "Что сохранить из разговора про GEO", "role": "theory"}, {"type": "p", "text": "Из лекции. Лектор говорит, что нейроответы Алисы забирают часть поискового внимания, и связывает оптимизацию для них с SEO. В записи произносится примерно 30%, но источник, период и определение показателя не названы. Для презентации или расчёта рынка эта цифра непригодна.", "role": "theory"}, {"type": "p", "text": "Применение к JKids. Упоминание «маркировки для нейросетей» в вопросе не является установленным названием обязательной технологии. В основном документе проекта уже есть отдельное исследование по официальным материалам Яндекса. Эта методичка не заменяет его и не утверждает, что достаточно поставить специальный код для попадания в Алису. Запуск GEO остаётся отдельным предложением, а не выполненной работой.", "role": "jkids"}, {"type": "p", "text": "Источник: часть 2, 00:29:15–00:30:47; состояние JKids по основному документу при подготовке методички.", "role": "source"}], "short": "Каналы продвижения", "desc": "Выбирать инструмент под задачу"}, {"id": 14, "title": "Рекламная маркировка и границы юридического блока", "blocks": [{"type": "p", "text": "Из лекции. Обсуждаются реклама в каналах, получение идентификатора через ОРД, участие администратора площадки и регулярная отчётность. Участники спрашивают о бартере и о продвижении своего курса на собственных ресурсах. Ответ про собственный контент зависит от того, является ли конкретная публикация рекламой. Повреждённая запись не позволяет извлечь полный юридический алгоритм, распределение обязанностей или достоверные суммы расходов.", "role": "theory"}, {"type": "p", "text": "Редакторское уточнение по первоисточникам. Письмо ФАС № АК/32908/25 различает справочную информацию о собственных услугах на официальном ресурсе и рекламу. В нём прямо допускаются информационные посты об условиях, ценах и акциях. Одновременно оценка зависит от содержания и обстоятельств размещения; продвижение сотрудником услуги на личной странице может признаваться рекламой. Поэтому упрощение «на любом своём канале ничего маркировать не нужно» использовать нельзя. Конкретную публикацию оценивают отдельно.", "role": "theory"}, {"type": "p", "text": "Федеральный закон № 72-ФЗ ввёл запрет распространения рекламы на перечисленных в нём ресурсах, включая ресурсы с ограниченным по соответствующему законодательству доступом; вступление в силу установлено с 1 сентября 2025 года. Поэтому обсуждение в повреждённой расшифровке Instagram нельзя превращать в совет маскировать рекламу под обычный пост. Маркировка не отменяет запрета на размещение. Для конкретной площадки и публикации нужна проверка их правового статуса.", "role": "theory"}, {"type": "p", "text": "Рабочее применение. Перед платным или бартерным размещением согласовать с исполнителем, кто получает идентификатор, оформляет размещение и передаёт требуемые сведения. Проверять собственный рекламный материал по содержанию и месту публикации. Здесь намеренно нет выдуманного тарифа ОРД, универсального налогового расчёта или инструкции по обходу требований.", "role": "practice"}, {"type": "p", "text": "Граница раздела: это сохранение темы лекции и исправление опасного упрощения, а не полный регламент рекламного законодательства. Бартер не следует автоматически считать освобождением от требований только потому, что деньги не перечисляются.", "role": "theory"}, {"type": "p", "text": "Источники лекции: часть 2, 00:25:01–00:27:45 и 00:30:49–00:31:48.", "role": "source"}, {"type": "p", "text": "Источники проверки: письмо ФАС России № АК/32908/25, https://www.consultant.ru/document/cons_doc_LAW_503349/ ; Федеральный закон № 72-ФЗ, статьи 2 и 3, https://www.consultant.ru/document/cons_doc_LAW_502592/ . Проверка выполнена при подготовке этой редакции. Перед размещением условия проверяются по действующим первоисточникам.", "role": "source"}], "short": "Реклама и маркировка", "desc": "Разобраться с границами юридического блока"}, {"id": 15, "title": "B2B и работа с уже возникшей потребностью", "blocks": [{"type": "p", "text": "Из лекции. Для продажи оборудования и других сложных продуктов сначала нужно определить задачу, критерии выбора и людей, которые принимают решение. Лектор рекомендует извлекать из характеристик преимущества, важные конкретной категории клиента. Обзор полезен, если сравнивает по тем параметрам, которые нужны покупателю.", "role": "theory"}, {"type": "p", "text": "Пример лектора. У оборудования для разных производств отличаются задачи применения. Поэтому одинаковая презентация всем покупателям слабее материала, который раскрывает нужные для их работы параметры. Если у клиента есть конкретная неисправность или потребность в модели детали, может работать посадочная страница с нужной моделью и путём к подбору аналога. Названия брендов и деталей в соответствующем рассказе повреждены, здесь они не восстанавливаются.", "role": "example"}, {"type": "p", "text": "Другой случай: потребность ещё не возникла и сейчас её невозможно ускорить. Например, без участка человек не начинает строительство. Тогда задача может состоять в том, чтобы потенциальный клиент запомнил компанию и вспомнил в нужный момент. Упоминания в контенте, медиа и профессиональной среде помогают узнаваемости, но не означают немедленную оплату.", "role": "theory"}, {"type": "p", "text": "При вопросе про B2G лектор прямо сообщает, что не имеет такого опыта. Поэтому эта методичка не приписывает ему отдельную стратегию государственных закупок.", "role": "theory"}, {"type": "p", "text": "Применение к JKids. Если будем продавать школе, лагерю или партнёру, потребуется отдельное исследование организации и её участников решения. Это не утверждённый поворот бизнеса. B2C-материалы для родителей нельзя автоматически назвать готовым B2B-предложением.", "role": "jkids"}, {"type": "h", "text": "Шестнадцать вопросов со слайда про идеального клиента B2B", "role": "theory"}, {"type": "p", "text": "Список воспроизведён по фотографии. Его используют при работе с организациями; родителям не нужно задавать вопросы о годовой выручке компании.", "role": "theory"}, {"type": "list", "text": "1. Отрасль и подкатегория, например строительство складов или медицинское оборудование.\n2. Сезонность приобретения.\n3. Периодичность приобретения.\n4. Объём закупок.\n5. География и наличие филиалов.\n6. Годовая выручка компании.\n7. Количество сотрудников.\n8. Квалификация сотрудников, включая офисных и рабочих.\n9. Какие профессии есть в компании.\n10. Критерии выбора поставщика.\n11. Потенциал роста клиента.\n12. Уровень технологического развития бизнеса.\n13. Стереотипы о продукте или отрасли.\n14. Опыт работы с аналогичной компанией.\n15. Опыт работы с нашей компанией: новый, действующий или вернувшийся клиент.\n16. Кто входит в закупочный комитет: советчик, влияющий на решение, инициатор, принимающий решение, «привратник», пользователь, покупатель.", "items": ["1. Отрасль и подкатегория, например строительство складов или медицинское оборудование.", "2. Сезонность приобретения.", "3. Периодичность приобретения.", "4. Объём закупок.", "5. География и наличие филиалов.", "6. Годовая выручка компании.", "7. Количество сотрудников.", "8. Квалификация сотрудников, включая офисных и рабочих.", "9. Какие профессии есть в компании.", "10. Критерии выбора поставщика.", "11. Потенциал роста клиента.", "12. Уровень технологического развития бизнеса.", "13. Стереотипы о продукте или отрасли.", "14. Опыт работы с аналогичной компанией.", "15. Опыт работы с нашей компанией: новый, действующий или вернувшийся клиент.", "16. Кто входит в закупочный комитет: советчик, влияющий на решение, инициатор, принимающий решение, «привратник», пользователь, покупатель."], "role": "theory"}, {"type": "p", "text": "Редакторское пояснение. «Привратник» в этом контексте означает человека, через которого проходит доступ к нужным участникам. Список помогает понять покупку, а не предписывает собрать все поля любой ценой перед первым разговором.", "role": "theory"}, {"type": "p", "text": "Источник: часть 1, 00:19:31–00:19:59; часть 2, 00:31:51–00:36:31 и 00:40:57–00:44:24; фотография B2B, файл 1325_993.", "role": "source"}], "short": "Продажи организациям", "desc": "Понять критерии и участников B2B"}, {"id": 16, "title": "От маркетинговой цели к конкретной работе", "blocks": [{"type": "p", "text": "Из лекции. На просьбу посоветовать простой инструмент для маркетингового плана лектор возвращает разговор к логике управления: сначала понять, где находимся и куда хотим прийти. Затем выбирать стратегию, тактику, действия и контроль.", "role": "theory"}, {"type": "p", "text": "В расшифровке название модели повреждено. Её не называем по догадке. Содержательная последовательность читается уверенно.", "role": "theory"}, {"type": "table", "rows": [["Этап", "Что должно быть понятно", "Учебное применение к JKids"], ["Анализ ситуации", "Что есть сейчас и чего не знаем", "Есть курс и медиа; причины платной покупки ещё исследуются"], ["Цель", "Какое изменение хотим получить", "Например, проверить одну ценность у выбранных семей"], ["Стратегия", "На кого и за счёт чего направляем усилия", "Выбираем один сегмент-кандидат и одну ценность"], ["Тактика", "Какие материалы и каналы используем", "Один конкретный материал и понятный путь к обращению"], ["Действие", "Кто и что сделает", "Ответственный, материал, срок, обслуживаемый контакт"], ["Контроль", "С чем сравним результат", "Заранее выбранные показатели и факты отказов"]], "text": "Этап Что должно быть понятно Учебное применение к JKids Анализ ситуации Что есть сейчас и чего не знаем Есть курс и медиа; причины платной покупки ещё исследуются Цель Какое изменение хотим получить Например, проверить одну ценность у выбранных семей Стратегия На кого и за счёт чего направляем усилия Выбираем один сегмент-кандидат и одну ценность Тактика Какие материалы и каналы используем Один конкретный материал и понятный путь к обращению Действие Кто и что сделает Ответственный, материал, срок, обслуживаемый контакт Контроль С чем сравним результат Заранее выбранные показатели и факты отказов", "role": "theory"}, {"type": "p", "text": "Стратегия и тактика отличаются масштабом решения. «Родители, которым неудобен офлайн, и проверка ценности обучения без поездок» может быть стратегическим направлением. «Снять объяснение процесса и разместить его в подходящем канале» описывает тактику. Это учебный пример, не согласованный план запуска.", "role": "theory"}, {"type": "p", "text": "Из лекции. Контроль замыкает цикл. Если ошиблись в понимании клиента, возвращаемся к анализу. Если неверно выбрали направление, пересматриваем стратегию. Если проблема в канале, меняем тактическое решение. Нельзя после любого плохого результата сразу объявлять маркетинг бесполезным или просто наращивать количество публикаций.", "role": "theory"}, {"type": "p", "text": "Лектор предлагает заранее определить, какой результат инструмента будет успешным. Числа в соответствующем фрагменте распознаны неоднозначно, поэтому из них не делается норматив стоимости лида.", "role": "theory"}, {"type": "p", "text": "Редакторское пояснение для начинающих. Лид здесь означает контакт или обращение потенциального клиента по заранее выбранному определению. Конверсия означает долю людей, совершивших следующий шаг. Если из 100 прослеженных переходов получили 5 обращений, конверсия перехода в обращение равна 5%. Это учебная арифметика, а не данные JKids.", "role": "theory"}, {"type": "p", "text": "Цена обращения при платном тесте: расходы на выбранный тест / число учтённых обращений. Если обращений нет, показатель нельзя представить как ноль рублей. Для сравнения важно одинаково определять обращение и расходы. Оплата, выручка и прибыль остаются отдельными показателями.", "role": "theory"}, {"type": "p", "text": "Рабочее задание. До подготовки одного теста заполните его карточку из раздела 17. Если неизвестно, какое предложение можно делать, сначала уточняйте продукт и исследование. Бюджет, цены и условия JKids этой методичкой не назначаются.", "role": "practice"}, {"type": "p", "text": "Источник: часть 2, 00:36:39–00:40:49.", "role": "source"}], "short": "План и контроль", "desc": "Пройти от анализа к проверке результата"}, {"id": 17, "title": "Рабочие формы для команды", "blocks": [{"type": "p", "text": "Все формы в этом разделе являются редакторской адаптацией лекции. Они нужны, чтобы выполнять её логику на практике. Это не цитаты со слайдов и не утверждённые новые правила управления JKids.", "role": "theory"}, {"type": "h", "text": "Форма разбора клиента", "role": "theory"}, {"type": "form", "text": "Семья или организация и источник сведений: ______.\nСобытие, после которого начали искать: ______.\nЗадача и ожидаемое изменение словами человека: ______.\nЧто мешает решить задачу и что уже пробовали: ______.\nЧто сравнивают, включая вариант ничего не менять: ______.\nКто инициирует, платит, пользуется и влияет на решение: ______.\nГлавное сомнение и его основание: ______.\nУдобный способ общения: ______.\nЧто подтверждено действием, а что только высказано: ______.\nНаш вывод и что нужно проверить дальше: ______.", "items": ["Семья или организация и источник сведений: ______.", "Событие, после которого начали искать: ______.", "Задача и ожидаемое изменение словами человека: ______.", "Что мешает решить задачу и что уже пробовали: ______.", "Что сравнивают, включая вариант ничего не менять: ______.", "Кто инициирует, платит, пользуется и влияет на решение: ______.", "Главное сомнение и его основание: ______.", "Удобный способ общения: ______.", "Что подтверждено действием, а что только высказано: ______.", "Наш вывод и что нужно проверить дальше: ______."], "role": "practice"}, {"type": "h", "text": "Форма конкретной выгоды", "role": "theory"}, {"type": "form", "text": "Кому и в какой ситуации: ______.\nМотив покупки: ______.\nКакое изменение даём: ______.\nЗа счёт чего оно получается в реальном продукте: ______.\nЧто человек должен сделать сам: ______.\nЧем можем подтвердить: ______.\nКакие ограничения должны быть понятны: ______.\nФормулировка для материала: ______.", "items": ["Кому и в какой ситуации: ______.", "Мотив покупки: ______.", "Какое изменение даём: ______.", "За счёт чего оно получается в реальном продукте: ______.", "Что человек должен сделать сам: ______.", "Чем можем подтвердить: ______.", "Какие ограничения должны быть понятны: ______.", "Формулировка для материала: ______."], "role": "practice"}, {"type": "h", "text": "Форма задания на контент", "role": "theory"}, {"type": "form", "text": "Аудитория и роль в решении: ______.\nСтупень готовности из четырёх: ______.\nОдин вопрос, на который отвечает материал: ______.\nФакт или демонстрация в основе: ______.\nЧто человек поймёт после просмотра: ______.\nСледующий шаг и куда он ведёт: ______.\nКто подготовит и кто проверит факты: ______.\nКак узнаем, что материал помог: ______.", "items": ["Аудитория и роль в решении: ______.", "Ступень готовности из четырёх: ______.", "Один вопрос, на который отвечает материал: ______.", "Факт или демонстрация в основе: ______.", "Что человек поймёт после просмотра: ______.", "Следующий шаг и куда он ведёт: ______.", "Кто подготовит и кто проверит факты: ______.", "Как узнаем, что материал помог: ______."], "role": "practice"}, {"type": "h", "text": "Карточка небольшого теста", "role": "theory"}, {"type": "form", "text": "Проверяемая гипотеза: ______.\nПочему выбрали её сейчас и на что опираемся: ______.\nКому покажем и как найдём этих людей: ______.\nСообщение, доказательство и путь к контакту: ______.\nЧто именно меняем относительно прежнего варианта: ______.\nКритерий результата до запуска: ______.\nПериод проверки, предел расходов и ответственный: ______.\nЧто фактически произошло: ______.\nПереходы / подходящие обращения / оплаты, если их отслеживали: ______.\nПричины сомнений, отказов или остановки: ______.\nВывод: продолжить, изменить или остановить; почему: ______.", "items": ["Проверяемая гипотеза: ______.", "Почему выбрали её сейчас и на что опираемся: ______.", "Кому покажем и как найдём этих людей: ______.", "Сообщение, доказательство и путь к контакту: ______.", "Что именно меняем относительно прежнего варианта: ______.", "Критерий результата до запуска: ______.", "Период проверки, предел расходов и ответственный: ______.", "Что фактически произошло: ______.", "Переходы / подходящие обращения / оплаты, если их отслеживали: ______.", "Причины сомнений, отказов или остановки: ______.", "Вывод: продолжить, изменить или остановить; почему: ______."], "role": "practice"}, {"type": "p", "text": "Не нужно заполнить все формы на каждую публикацию. Для одной задачи берём нужную форму. Рабочие задачи остаются в существующей доске команды, а решение по бизнесу и ссылка на подробности в основном документе.", "role": "theory"}], "short": "Рабочие формы", "desc": "Клиент, выгода, контент и тест"}, {"id": 18, "title": "Практикум по одной гипотезе JKids", "blocks": [{"type": "p", "text": "Этот практикум является предложением для освоения методички. Он не означает, что Сергей уже поручил команде все перечисленные действия или утвердил рекламный запуск.", "role": "theory"}, {"type": "h", "text": "Шаг 1 Разобрать одну реальную историю", "role": "theory"}, {"type": "p", "text": "Возьмите запись или корректную фиксацию разговора с родителем. Заполните форму клиента. Покажите, откуда взялось каждое существенное утверждение. Не дополняйте рассказ своими представлениями о типичной маме. Если полноценных данных мало, сначала сформулируйте, чего не хватает.", "role": "theory"}, {"type": "p", "text": "Ожидаемый результат: понятно, что случилось, что семья хотела изменить, какие варианты рассматривала и чего опасалась. «Родитель заинтересовался» без истории не подходит.", "role": "theory"}, {"type": "h", "text": "Шаг 2 Выделить одну ценность и одну ступень", "role": "theory"}, {"type": "p", "text": "Выберите одно направление, которое имеет основание в разговоре. Например, удобство организации занятий или возможность интересного самостоятельного творчества. Это кандидаты, не готовые выводы. Определите, ищет ли семья категорию, конкретный продукт или подтверждение выбора.", "role": "theory"}, {"type": "p", "text": "Ожидаемый результат: одно предложение о ценности и один вопрос, который сейчас важен человеку. Если важен вопрос онлайна, материал должен объяснять формат и ограничения, а не просто показывать красивую модель.", "role": "theory"}, {"type": "h", "text": "Шаг 3 Найти настоящее доказательство", "role": "theory"}, {"type": "p", "text": "Выберите реальный урок, работу, процесс или объяснение Сергея. Проверьте происхождение результата и соответствие обещанию. Нельзя показывать рекламную AI-картинку как самостоятельную работу ученика.", "role": "theory"}, {"type": "p", "text": "Ожидаемый результат: команда может объяснить, что материал доказывает и где его предел. Красивый итог может показывать техническую возможность, но не мотивацию каждого ребёнка и не готовность родителя платить.", "role": "theory"}, {"type": "h", "text": "Шаг 4 Подготовить один материал с понятным продолжением", "role": "theory"}, {"type": "p", "text": "Заполните задание на контент. Согласуйте фактическое содержание и допустимое предложение. Если коммерческие условия ещё не определены, не добавляйте фиктивную цену, срок, гарантию или набор в группу. Возможный следующий шаг должен соответствовать текущей работе: например, посмотреть процесс или задать вопрос о формате.", "role": "theory"}, {"type": "p", "text": "Ожидаемый результат: человек понимает, что увидел, зачем это ему и куда можно обратиться. Команда готова обработать обращение.", "role": "theory"}, {"type": "h", "text": "Шаг 5 Разобрать результат и выбрать одно изменение", "role": "theory"}, {"type": "p", "text": "Сопоставьте ожидание с данными. Если люди не переходят, сначала проверяем сообщение и доступность пути. Если переходят, но не обращаются, изучаем ясность предложения и сомнения. Если обращаются, но не покупают, разбираем реальные причины. Это направления диагностики, не автоматическое доказательство причины.", "role": "theory"}, {"type": "p", "text": "Ожидаемый результат: конкретный вывод по гипотезе и одно следующее действие. Нельзя объявлять проверку успешной только по просмотрам, если её целью были подходящие обращения или оплаты.", "role": "theory"}, {"type": "h", "text": "Что проверяем перед передачей материала", "role": "theory"}, {"type": "list", "text": "1. Названа конкретная аудитория и её роль в покупке.\n2. Выбрана одна задача сообщения и ступень готовности.\n3. Выгода раскрыта, а не спрятана в словах «качественно» и «полезно».\n4. Есть реальный факт или демонстрация.\n5. Не обещаны отсутствующие функции, цена, срок или результат.\n6. Понятно, куда ведёт следующее действие и кто отвечает.\n7. Критерий результата соответствует задаче.\n8. Факты, слова клиентов и предположения не смешаны.", "items": ["1. Названа конкретная аудитория и её роль в покупке.", "2. Выбрана одна задача сообщения и ступень готовности.", "3. Выгода раскрыта, а не спрятана в словах «качественно» и «полезно».", "4. Есть реальный факт или демонстрация.", "5. Не обещаны отсутствующие функции, цена, срок или результат.", "6. Понятно, куда ведёт следующее действие и кто отвечает.", "7. Критерий результата соответствует задаче.", "8. Факты, слова клиентов и предположения не смешаны."], "role": "theory"}, {"type": "h", "text": "Чего пока нельзя объявлять результатом JKids", "role": "theory"}, {"type": "p", "text": "На момент подготовки методички платный онлайн-спрос не подтверждён. Цена, коммерческий формат и срок не утверждены. Применение Blender и ИИ развивается как направление, а не готовая доказанная ценность для всех родителей. Создание игрового прототипа Сергеем не означает, что школа уже обучает всех детей делать опубликованные игры. Гипотеза совместного творчества родителя и ребёнка не выбрана вместо действующего исследования.", "role": "theory"}, {"type": "p", "text": "Ближайшее полезное применение методички: разобрать один реальный родительский разговор, выбрать из него одну ценность для проверки и подготовить один соответствующий материал. Массовое производство контента до этого не решает нехватку понимания клиента.", "role": "theory"}], "short": "Практикум JKids", "desc": "Провести одну гипотезу через пять шагов"}, {"id": 19, "title": "Карта источников и границы восстановления", "blocks": [{"type": "p", "text": "Таймкоды позволяют вернуться к словам из записи. Они относятся к исходным текстам, а не к монтажному таймлайну объединённой лекции. Пересказ примеров сохраняет смысл, но исправляет разговорную форму и шум распознавания.", "role": "theory"}, {"type": "table", "rows": [["Тема", "Источник"], ["Маркетинг и прибыль, изменения площадок", "Часть 1, 00:01:49–00:05:31"], ["Клиенты, лиды, LTV и нестандартное применение", "Часть 1, 00:06:16–00:14:06"], ["Мотивы, российский контекст, каналы общения", "Часть 1, 00:14:20–00:19:17"], ["B2B портрет и участники решения", "Часть 1, 00:19:31–00:24:13; фото 1325_993"], ["Задачи, трудности, документы, ожидания", "Часть 1, 00:24:47–00:30:49"], ["Риски и вопрос детских курсов", "Часть 1, 00:30:49–00:38:11"], ["Конкуренция с бездействием", "Часть 1, 00:38:11–00:39:57"], ["Родитель и ребёнок в разных городах", "Часть 1, 00:41:59–00:46:30"], ["Автоматизация смет и страх изменения профессии", "Часть 1, 00:46:40–00:53:23"], ["Мотивы и конкретизация выгод", "Часть 1, 00:54:19–01:03:03; фото 1863_949"], ["Пример рекламного заголовка", "Часть 1, 01:03:03–01:05:18"], ["Роли покупателей", "Часть 2, 00:00:00–00:05:26"], ["Лестница и работа с разными уровнями", "Часть 2, 00:05:30–00:08:20; 00:17:23–00:19:41; фото 1685_989"], ["Доверие, газеты и склад двигателей", "Часть 2, 00:07:52–00:15:49"], ["Каналы, маркировка и GEO", "Часть 2, 00:21:16–00:31:48"], ["Выбор критериев и B2B потребность", "Часть 2, 00:31:51–00:36:31; 00:40:57–00:44:24"], ["Планирование и контроль", "Часть 2, 00:36:39–00:40:49"], ["Основатель и бренд компании", "Часть 2, 00:44:26–00:46:06"]], "text": "Тема Источник Маркетинг и прибыль, изменения площадок Часть 1, 00:01:49–00:05:31 Клиенты, лиды, LTV и нестандартное применение Часть 1, 00:06:16–00:14:06 Мотивы, российский контекст, каналы общения Часть 1, 00:14:20–00:19:17 B2B портрет и участники решения Часть 1, 00:19:31–00:24:13; фото 1325_993 Задачи, трудности, документы, ожидания Часть 1, 00:24:47–00:30:49 Риски и вопрос детских курсов Часть 1, 00:30:49–00:38:11 Конкуренция с бездействием Часть 1, 00:38:11–00:39:57 Родитель и ребёнок в разных городах Часть 1, 00:41:59–00:46:30 Автоматизация смет и страх изменения профессии Часть 1, 00:46:40–00:53
